<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passatempo Educativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Ubuntu:wght@400&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="fotos/logo.ico">
</head>
<body style="background-image: url('fotos/background.jpg'); background-size: cover; background-position: center; background-attachment: fixed;">
    <header class="header py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="logo">
                <img src="fotos/logo4.png" alt="Passatempo Educativo" width="150">
            </div>
            <nav class="navbar navbar-expand-md navbar-light">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link btn btn-primary text-black" href="index.html">HOME</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-primary text-black" href="eventos.html">EVENTOS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-primary text-black" href="oficinas.html">OFICINAS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-primary text-black" href="saude.html">SAÚDE E BEM-ESTAR</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-primary text-black" href="doação.html">DOAÇÃO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-primary text-black" href="login.html">LOGIN</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container my-5">
            <section class="text-center">
                <h3>LOGIN</h3>
            </section>

            <div class="container mt-5">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-4">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="usernameInput" placeholder="Usuário">
                            <label for="usernameInput">Usuário</label>
                        </div>
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-4">
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="passwordInput" placeholder="Senha">
                            <label for="passwordInput">Senha</label>
                        </div>
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-md-4">
                        <button class="btn btn-primary w-100" onclick="login()">Entrar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-black text-center py-3">
        <p>Telefone: (11) 99757-9540</p>
        <p>E-mail: passatempo@passatempoeducativo.org.br</p>
        <p>© PASSATEMPO EDUCATIVO | TODOS OS DIREITOS RESERVADOS</p>
    </footer>

    <script>
        async function login() {
            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;

            const response = await fetch('http://localhost:3000/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });

            const data = await response.json();
            if (response.ok) {
                localStorage.setItem('token', data.token);
                window.location.href = 'admin.html';
            } else {
                alert(data.message || 'Erro ao fazer login');
            }
        }

        if (response.ok) {
            console.log("Token recebido:", data.token);
            localStorage.setItem('token', data.token);
            window.location.href = 'admin.html';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
</body>
</html>
